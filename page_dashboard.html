<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= include('stylesheet'); ?>
    <title>종달샘</title>
  </head>
  <body>
    <div class="container">
      <header style="text-align: center; margin-bottom: 20px;">
        <h1><span id="user-id-display"></span> 학생, 환영합니다!</h1>
        <h3>내 라크: <span id="rak-display">0</span> 라크</h3>
        <h3>내 친구코드: <span id="uniq4-display" style="color: var(--point-color); cursor: pointer;" title="클릭하여 복사"></span></h3>
      </header>

      <main id="main-content">
        <!-- 페이지 내용이 여기에 로드됩니다 -->
      </main>
    </div>

    <nav>
      <a href="#coupon" class="nav-link" data-page="coupon"><i class="material-icons">redeem</i> 쿠폰</a>
      <a href="#letter" class="nav-link" data-page="letter"><i class="material-icons">mail</i> 편지</a>
      <a href="#shop" class="nav-link" data-page="shop"><i class="material-icons">shopping_cart</i> 쇼핑</a>
      <a href="#portfolio" class="nav-link" data-page="portfolio"><i class="material-icons">person</i> 옹달샘</a>
      <a href="#" onclick="logout()"><i class="material-icons">logout</i> 로그아웃</a>
    </nav>
    
    <div id="loader" class="loader"></div>
    <?!= include('javascript'); ?>
    <script>
      let currentPage = '';

      function loadPage(pageName) {
        if(currentPage === pageName) return;
        currentPage = pageName;
        
        showLoader();
        // 기존 내용 지우기
        document.getElementById('main-content').innerHTML = '';
        
        // 새 내용 로드
        fetch(`<?= ScriptApp.getService().getUrl() ?>?page=${pageName}_content`)
          .then(response => response.text())
          .then(html => {
            document.getElementById('main-content').innerHTML = html;
            // 각 페이지별 초기화 스크립트 실행
            if (window[`init${capitalize(pageName)}Page`]) {
              window[`init${capitalize(pageName)}Page`]();
            }
            hideLoader();
          }).catch(err => {
            console.error('페이지 로드 실패:', err);
            hideLoader();
          });
        
        // 네비게이션 활성화 상태 업데이트
        document.querySelectorAll('.nav-link').forEach(link => {
            link.classList.remove('active');
            if(link.dataset.page === pageName) {
                link.classList.add('active');
            }
        });
      }

      function capitalize(str) {
        return str.charAt(0).toUpperCase() + str.slice(1);
      }

      // --- 초기화 ---
      document.addEventListener('DOMContentLoaded', () => {
        const user = checkLogin();
        if(!user) return;
        
        document.getElementById('user-id-display').textContent = user.studentId;
        localStorage.setItem('userRak', localStorage.getItem('userRak') || 0);
        localStorage.setItem('userUniq4', localStorage.getItem('userUniq4') || '----');
        
        updateRakDisplay();
        document.getElementById('uniq4-display').textContent = localStorage.getItem('userUniq4');

        document.getElementById('uniq4-display').addEventListener('click', (e) => {
            navigator.clipboard.writeText(e.target.textContent).then(() => {
                alert('친구코드가 복사되었습니다!');
            });
        });

        // URL 해시에 따라 초기 페이지 로드
        const initialPage = window.location.hash.substring(1) || 'coupon';
        loadPage(initialPage);

        // 네비게이션 링크 클릭 이벤트
        document.querySelectorAll('.nav-link').forEach(link => {
          link.addEventListener('click', (e) => {
            e.preventDefault();
            const pageName = link.dataset.page;
            window.location.hash = pageName; // URL 해시 변경
          });
        });

        // 해시 변경 감지
        window.addEventListener('hashchange', () => {
            const pageName = window.location.hash.substring(1) || 'coupon';
            loadPage(pageName);
        });

      });
    </script>
  </body>
</html>
