<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>종달샘 - 최종 연동판</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://unpkg.com/qrcode@1.4.4/build/qrcode.min.js"></script>
  <style>
    @font-face {
      font-family: 'MoneygroRounded';
      src: url('./MoneygroRounded.ttf') format('truetype');
      font-display: swap;
    }
    body {
      margin: 0; background: #A9F5D0; color: #009688;
      font-family: 'MoneygroRounded', 'Noto Sans KR', sans-serif;
      min-height: 100vh; padding-bottom: 95px;
    }
    .container { max-width: 720px; margin: 0 auto; padding: 22px 4vw 0 4vw; text-align: center; }
    .main-title { margin: 24px 0 10px; font-size: 2.08rem; font-weight: 900; color: #004D40; }
    .main-title span { color: #FF6D1B; }
    .card {
      background: #fff; border-radius: 28px; box-shadow: 0 4px 20px #004d4017;
      padding: 26px 18px; margin: 22px auto 20px auto; max-width: 95%;
      position: relative; border: 2.5px solid #FF6D1B; text-align: center;
    }
    .notice {
      margin-top: 5px; font-weight: 700; font-size: 0.96em; background: #A9F5D0;
      color: #FF6D1B; border: 1.5px solid #FF6D1B; border-radius: 14px;
      padding: 10px; text-align: center; white-space: pre-wrap;
    }
    .menu { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 15px 0; justify-content: center; }
    .menu button {
      min-width: 120px; background: #FF6D1B; color: #fff; border: none; border-radius: 14px;
      padding: 10px 14px; font-weight: bold; font-size: 1em; cursor: pointer; margin: 0;
      box-shadow: 0 2px 10px #ff6d1b19; transition: background .14s;
      display: flex; align-items: center; justify-content: center; gap: 5px;
    }
    input, textarea {
      width: 90%; margin: 8px auto; padding: 10px; border-radius: 16px;
      border: 2px solid #FF6D1B; font-family: inherit; font-size: 1em;
    }
    .btn-action {
      background: #FF6D1B; color: #fff; border: none; border-radius: 16px; padding: 12px 25px;
      font-size: 1.05em; font-weight: bold; cursor: pointer; box-shadow: 0 2px 10px #ff6d1b19;
      transition: all .2s; margin: 10px 0 4px 0;
    }
    #qr-code {
      margin: 15px auto; width: 180px; height: 180px; display: flex; align-items: center;
      justify-content: center; background: #fff; border-radius: 14px; border: 2px solid #FF6D1B;
    }
    .hidden { display: none; }
    .history-item { background: #E8F5E9; padding: 10px 15px; margin: 8px 0; border-radius: 12px; font-size: 1em; }
    @media (max-width:600px) {
      .main-title { font-size:1.3rem; }
      .card { padding:16px 3vw; margin:12px auto; }
      .btn-action, input, textarea { width:95%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="landing" class="card">
      <div class="main-title"><span>종달샘</span> 서비스</div>
      <div class="menu">
        <button onclick="showPanel('login')">로그인</button>
        <button onclick="showPanel('signup')">회원가입</button>
      </div>
      <div class="notice">
        CORS 정책 및 오류 처리가 강화된 버전입니다.
      </div>
    </div>

    <div id="login" class="card hidden">
      <div class="main-title"><span>로그인</span></div>
      <input type="text" id="login-id" placeholder="학번" required>
      <input type="password" id="login-pw" placeholder="비밀번호" required>
      <button class="btn-action" onclick="login()">로그인</button>
      <button class="btn-action" onclick="showPanel('landing')">뒤로가기</button>
    </div>

    <div id="signup" class="card hidden">
      <div class="main-title"><span>회원가입</span></div>
      <input type="text" id="signup-id" placeholder="학번" required>
      <input type="password" id="signup-pw" placeholder="비밀번호" required>
      <button class="btn-action" onclick="signup()">가입하기</button>
      <button class="btn-action" onclick="showPanel('landing')">뒤로가기</button>
    </div>
    
    <div id="mypage" class="card hidden">
      <div class="main-title"><span>마이페이지</span></div>
      <p>학번: <b id="current-id"></b> | 포인트: <b id="current-point"></b></p>
      <div class="menu">
        <button onclick="showPanel('coupon')">쿠폰</button>
        <button onclick="showPanel('letter')">편지</button>
        <button onclick="showPanel('portfolio')">기록</button>
        <button onclick="logout()">로그아웃</button>
      </div>
    </div>

    <div id="coupon" class="card hidden">
      <div class="main-title"><span>쿠폰</span></div>
      <div id="qr-code"></div>
      <input type="text" id="coupon-code" placeholder="쿠폰 번호를 입력하세요" required>
      <button class="btn-action" onclick="addCoupon()">쿠폰 등록</button>
      <button class="btn-action" onclick="generateQR()">QR 생성</button>
      <button class="btn-action" onclick="showPanel('mypage')">뒤로가기</button>
    </div>

    <div id="letter" class="card hidden">
      <div class="main-title"><span>편지 쓰기</span></div>
      <input type="text" id="letter-to" placeholder="받는 사람 학번" required>
      <textarea id="letter-content" placeholder="편지 내용을 입력하세요" style="min-height: 90px;"></textarea>
      <button class="btn-action" onclick="sendLetter()">보내기 (1000P 적립)</button>
      <button class="btn-action" onclick="showPanel('mypage')">뒤로가기</button>
    </div>

    <div id="portfolio" class="card hidden">
      <div class="main-title"><span>활동 기록</span></div>
      <div class="history-item">쿠폰 사용: <b id="portfolio-coupons">0</b>회</div>
      <div class="history-item">편지 작성: <b id="portfolio-letters">0</b>회</div>
      <button class="btn-action" onclick="showPanel('mypage')">뒤로가기</button>
    </div>

  </div>

<script>
// ================================================================
//               1. 백엔드(Google Apps Script) 연동 설정
// ================================================================
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbx4k4tQy3KqL3sKdbwvoB6AN1vo4P6hcxO9x0XTHDS1Aaa482F5RYpJjp--yXDiMGPO/exec";
let currentStudentId = null;
let currentPoint = 0;

// ================================================================
//               2. 궁극의 프론트엔드 오류 핸들러
// ================================================================
function handleApiError(error, context) {
  console.error(`[API 오류] ${context}:`, error);
  let userMessage = `[${context}] 작업 중 문제가 발생했습니다.\n\n`;

  if (error instanceof TypeError && error.message.includes('Failed to fetch')) {
    userMessage += "‼️ 네트워크 또는 CORS 정책 오류입니다.\n\n" +
      "이것은 브라우저 보안 정책 때문에 발생하며, 서버의 허락이 필요합니다.\n\n" +
      "✅ 확인 및 해결 방법:\n" +
      "1. 인터넷 연결을 확인해주세요.\n" +
      "2. 백엔드(Google Apps Script)가 올바르게 배포되었는지, 그리고 '새로운 배포'로 업데이트되었는지 확인하세요.\n" +
      "3. 백엔드 코드에 CORS 허용 헤더가 포함되어 있는지 개발자에게 문의하세요. (doPost, doGet, doOptions 함수에 'Access-Control-Allow-Origin' 헤더 설정이 필수입니다.)";
  } else if (error instanceof SyntaxError) {
    userMessage += "‼️ 서버 응답 형식 오류입니다.\n\n" +
      "서버가 보낸 응답이 유효한 JSON 형식이 아닙니다. 이것은 백엔드 스크립트 자체에 오류가 있을 가능성이 매우 높습니다.\n\n" +
      "✅ 해결 방법:\n" +
      "1. 개발자에게 연락하여 백엔드 스크립트의 실행 로그를 확인해달라고 요청하세요.\n" +
      "2. 서버 코드가 `ContentService.createTextOutput(JSON.stringify(...))`를 사용하여 정확한 JSON을 반환하는지 확인해야 합니다.";
  } else {
    // 백엔드에서 보낸 에러 메시지 (e.g., "포인트 부족", "이미 가입된 학번")
    userMessage += `‼️ 서버에서 전달된 오류:\n\n'${error.message}'`;
  }
  alert(userMessage);
}

// ================================================================
//              3. 중앙 API 호출 함수 (CORS 정책 준수)
// ================================================================
async function callBackend(action, payload = {}) {
  try {
    const response = await fetch(WEBAPP_URL, {
      method: 'POST',
      mode: 'cors', // CORS 요청임을 명시
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ action, ...payload })
    });

    if (!response.ok) {
      throw new Error(`서버 응답 오류 (HTTP Status: ${response.status})`);
    }

    const text = await response.text();
    // 응답이 비어있는 경우를 대비
    if (!text) {
        throw new Error("서버로부터 비어있는 응답을 받았습니다.");
    }
    const data = JSON.parse(text);

    if (data.success === false) {
      throw new Error(data.message || '서버에서 처리 중 알 수 없는 오류가 발생했습니다.');
    }

    return data;
  } catch (error) {
    handleApiError(error, `${action} 작업`);
    return null; // 실패 시 null 반환
  }
}

// ================================================================
//                      4. 페이지 및 기능별 함수
// ================================================================

function showPanel(panelId) {
  document.querySelectorAll('.card').forEach(el => el.classList.add('hidden'));
  document.getElementById(panelId).classList.remove('hidden');
  if (panelId === 'mypage') {
    document.getElementById('current-id').textContent = currentStudentId;
    document.getElementById('current-point').textContent = currentPoint;
  } else if (panelId === 'portfolio') {
    loadPortfolio();
  }
}

function logout() {
  currentStudentId = null;
  currentPoint = 0;
  showPanel('landing');
}

async function signup() {
  const studentId = document.getElementById('signup-id').value.trim();
  const password = document.getElementById('signup-pw').value.trim();
  if (!studentId || !password) return alert('학번과 비밀번호를 모두 입력하세요.');

  const data = await callBackend('signup', { studentId, password });
  if (data) {
    alert('회원가입이 완료되었습니다. 로그인해주세요.');
    showPanel('login');
    document.getElementById('signup-id').value = '';
    document.getElementById('signup-pw').value = '';
  }
}

async function login() {
  const studentId = document.getElementById('login-id').value.trim();
  const password = document.getElementById('login-pw').value.trim();
  if (!studentId || !password) return alert('학번과 비밀번호를 모두 입력하세요.');
  
  const data = await callBackend('login', { studentId, password });
  if (data) {
    currentStudentId = studentId;
    currentPoint = data.data.point;
    showPanel('mypage');
    document.getElementById('login-id').value = '';
    document.getElementById('login-pw').value = '';
  }
}

function generateQR() {
  const code = Math.random().toString(36).substring(2, 14).toUpperCase();
  document.getElementById('qr-code').innerHTML = '';
  new QRCode(document.getElementById('qr-code'), code);
  document.getElementById('coupon-code').value = code;
}

async function addCoupon() {
  if (!currentStudentId) return showPanel('login');
  const code = document.getElementById('coupon-code').value.trim();
  if (!code) return alert('쿠폰 번호를 입력하세요.');

  const data = await callBackend('add_coupon', { studentId: currentStudentId, code });
  if (data) {
    alert('쿠폰 등록 성공! 10포인트가 적립되었습니다.');
    currentPoint += 10;
    showPanel('mypage');
    document.getElementById('coupon-code').value = '';
  }
}

async function sendLetter() {
  if (!currentStudentId) return showPanel('login');
  const toId = document.getElementById('letter-to').value.trim();
  const content = document.getElementById('letter-content').value.trim();
  if (!toId || !content) return alert('받는 사람 학번과 편지 내용을 모두 입력하세요.');

  const data = await callBackend('send_letter', { fromId: currentStudentId, toId, content });
  if (data) {
    alert('편지 전송 성공! 1000포인트가 적립되었습니다.');
    currentPoint += 1000;
    showPanel('mypage');
    document.getElementById('letter-to').value = '';
    document.getElementById('letter-content').value = '';
  }
}

async function loadPortfolio() {
  if (!currentStudentId) return showPanel('login');
  const data = await callBackend('portfolio', { studentId: currentStudentId });
  if (data) {
    const p = data.data;
    document.getElementById('portfolio-coupons').textContent = p.coupons || 0;
    document.getElementById('portfolio-letters').textContent = p.letters || 0;
  }
}

// 페이지 로드 시 시작 화면 표시
window.addEventListener('load', () => showPanel('landing'));

</script>
</body>
</html>
