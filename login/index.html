<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>로그인 | 종달샘 포인트 샵</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="main-title"><span>로그인</span></div>
    <form id="login-form" class="modal-content" style="margin:60px auto 40px;" autocomplete="off">
      <div class="modal-header">
        <h2>학번과 비밀번호를 입력하세요</h2>
        <p>계정이 없다면 자동으로 회원가입 됩니다.</p>
      </div>
      <div class="form-field">
        <label for="student-id">학번 <span style="color:#b62323">*</span></label>
        <input type="text" id="student-id" required placeholder="30101"/>
      </div>
      <div class="form-field">
        <label for="password">비밀번호 <span style="color:#b62323">*</span></label>
        <input type="password" id="password" required placeholder="비밀번호"/>
      </div>
      <button class="order-btn" id="login-btn" type="submit">
        <span class="material-icons">check_circle</span> 로그인/회원가입
      </button>
      <div class="notice">
        ※ 비밀번호는 <b>본인만 아는 걸</b>로 정하세요!
      </div>
    </form>
    <div class="footer">
      <h3>문제가 있나요?</h3>
      <div class="contact-info">
        <div class="contact-item"><span class="material-icons">phone</span>010-1234-5678</div>
      </div>
    </div>
  </div>

  <script src="coupon.js"></script>
  <script>
    // 이 파일에서만 필요한 부분(실제 서버는 API를 부르겠지만, 여기선 그냥 흐름만)
    document.getElementById('login-form').onsubmit = function(e) {
      e.preventDefault();
      const id = document.getElementById('student-id').value;
      const pw = document.getElementById('password').value;
      // 가상: localStorage에 저장(실제론 서버에 보내야)
      localStorage.setItem('jongdalsam_user_id', id);
      localStorage.setItem('jongdalsam_user_pw', pw);
      // 실제론 서버에서 회원 확인, 리턴, 토큰 발급 등
      alert('환영합니다! 마이페이지로 이동합니다.');
      window.location.href = 'mypage.html';
    };
  </script>
</body>
</html>
